<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1560" viewBox="0 0 1440 1560">
  <defs>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500;700;800&amp;display=swap');
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .serif {
      font-family: 'Instrument Serif', serif;
    }
    </style>
    <pattern id="rmGrid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M 72 0 L 0 0 0 72" fill="none" stroke="#ffffff" stroke-opacity="0.035"
        stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1440" height="1560" fill="#0a0714" />
  <rect width="1440" height="1560" fill="url(#rmGrid)" />

  <text x="72" y="62" class="mono" font-size="20" font-weight="800"
    fill="#f3eaff">&lt;open/&gt;</text>
  <g class="mono" font-size="13" font-weight="500" fill="#adb5bd">
    <text x="640" y="58">Docs</text>
    <text x="716" y="58">API</text>
    <text x="784" y="58">Roadmap</text>
    <text x="890" y="58">Blog</text>
    <text x="956" y="58">GitHub</text>
  </g>
  <rect x="1262" y="34" width="122" height="34" rx="6" fill="#8262db" />
  <text x="1284" y="56" class="mono" font-size="12" font-weight="700"
    fill="#fbf7ff">Get started</text>
  <line x1="0" y1="84.5" x2="1440" y2="84.5" stroke="#ffffff" stroke-opacity="0.08" />

  <text x="72" y="150" class="mono" font-size="12" font-weight="500" fill="#b59cff"
    letter-spacing="3.5">ROADMAP — WHERE THE STABLE LINE GOES</text>

  <text x="64" y="300" class="serif" font-size="130" font-style="italic"
    fill="#b59cff">Forward,</text>
  <text x="64" y="424" class="mono" font-size="100" font-weight="800" fill="#f3eaff"
    letter-spacing="-5">VERSIONED.</text>

  <!-- timeline spine -->
  <line x1="200" y1="500" x2="200" y2="1450" stroke="#ffffff" stroke-opacity="0.1" />

  <!-- shipped -->
  <g>
    <circle cx="200" cy="560" r="8" fill="#8262db" />
    <text x="260" y="596" class="mono" font-size="64" font-weight="800" fill="#f3eaff"
      letter-spacing="-2">0.41.0</text>
    <rect x="520" y="540" width="100" height="30" rx="6" fill="#8262db" />
    <text x="538" y="560" class="mono" font-size="11" font-weight="700" fill="#fbf7ff">STABLE</text>
    <text x="660" y="566" class="serif" font-size="30" font-style="italic"
      fill="#b59cff">core interface freeze</text>
    <text x="260" y="640" class="mono" font-size="12.5"
      fill="#adb5bd">Five-package graph; defineElement / definePage / defineApp / buildApp frozen.</text>
    <text x="260" y="666" class="mono" font-size="12.5"
      fill="#adb5bd">Scoped: request-time semantics stay unfrozen (ADR-0119).</text>
  </g>

  <!-- active -->
  <g>
    <circle cx="200" cy="760" r="8" fill="none" stroke="#b59cff" stroke-width="2" />
    <circle cx="200" cy="760" r="3" fill="#b59cff" />
    <text x="260" y="796" class="mono" font-size="64" font-weight="800" fill="#b59cff"
      letter-spacing="-2">0.42.0</text>
    <rect x="520" y="740" width="100" height="30" rx="6" fill="none" stroke="#b59cff"
      stroke-width="1.5" />
    <text x="544" y="760" class="mono" font-size="11" font-weight="700" fill="#b59cff">NEXT</text>
    <text x="660" y="766" class="serif" font-size="30" font-style="italic"
      fill="#b59cff">WC application loop</text>
    <text x="260" y="840" class="mono" font-size="12.5"
      fill="#adb5bd">One route-to-interaction loop: load, DSD render, progressive form, action,</text>
    <text x="260" y="866" class="mono" font-size="12.5"
      fill="#adb5bd">error/redirect and revalidation — works without JavaScript.</text>
  </g>

  <!-- planned -->
  <g>
    <circle cx="200" cy="960" r="8" fill="none" stroke="#58399e" stroke-width="2" />
    <text x="260" y="996" class="mono" font-size="64" font-weight="800" fill="none" stroke="#58399e"
      stroke-width="1.2" letter-spacing="-2">0.43.0</text>
    <text x="600" y="966" class="serif" font-size="30" font-style="italic"
      fill="#8262db">universal WC SSR</text>
    <text x="260" y="1040" class="mono" font-size="12.5"
      fill="#adb5bd">CEM admission, DSD/light/client-only classification, native/Lit/FAST/Stencil</text>
    <text x="260" y="1066" class="mono" font-size="12.5"
      fill="#adb5bd">corpus, hydration-mismatch diagnostics.</text>
  </g>
  <g>
    <circle cx="200" cy="1160" r="8" fill="none" stroke="#58399e" stroke-width="2" />
    <text x="260" y="1196" class="mono" font-size="64" font-weight="800" fill="none"
      stroke="#58399e" stroke-width="1.2" letter-spacing="-2">0.44.0</text>
    <text x="600" y="1166" class="serif" font-size="30" font-style="italic"
      fill="#8262db">production runtime</text>
    <text x="260" y="1240" class="mono" font-size="12.5"
      fill="#adb5bd">Node and Workers behavior, stream/abort/timeout, cache/ISR/SWR, deploy</text>
    <text x="260" y="1266" class="mono" font-size="12.5"
      fill="#adb5bd">manifests, version-skew handling.</text>
  </g>
  <g>
    <circle cx="200" cy="1360" r="8" fill="none" stroke="#58399e" stroke-width="2" />
    <text x="260" y="1396" class="mono" font-size="64" font-weight="800" fill="none"
      stroke="#58399e" stroke-width="1.2" letter-spacing="-2">1.0.0</text>
    <text x="560" y="1366" class="serif" font-size="30" font-style="italic"
      fill="#8262db">stable five-package product</text>
    <text x="260" y="1440" class="mono" font-size="12.5"
      fill="#adb5bd">External production users prove the core interfaces hold.</text>
  </g>

  <!-- truth strip -->
  <g>
    <rect x="900" y="500" width="468" height="180" rx="12" fill="#130a22" stroke="#58399e" />
    <rect x="900" y="500" width="4" height="180" fill="#8262db" />
    <text x="928" y="538" class="mono" font-size="11" font-weight="700"
      fill="#b59cff">DESIGN RULE</text>
    <text x="928" y="572" class="mono" font-size="12.5"
      fill="#adb5bd">No new package is created by default. Auth,</text>
    <text x="928" y="596" class="mono" font-size="12.5"
      fill="#adb5bd">ORM and storage remain recipes — openElement</text>
    <text x="928" y="620" class="mono" font-size="12.5"
      fill="#adb5bd">owns the application contract, not service</text>
    <text x="928" y="644" class="mono" font-size="12.5" fill="#adb5bd">products.</text>
  </g>
</svg>
