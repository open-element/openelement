<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1520" viewBox="0 0 1440 1520">
  <defs>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500;700;800&amp;display=swap');
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .serif {
      font-family: 'Instrument Serif', serif;
    }
    </style>
    <pattern id="apiGrid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M 72 0 L 0 0 0 72" fill="none" stroke="#ffffff" stroke-opacity="0.035"
        stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1440" height="1520" fill="#0a0714" />
  <rect width="1440" height="1520" fill="url(#apiGrid)" />

  <text x="72" y="62" class="mono" font-size="20" font-weight="800"
    fill="#f3eaff">&lt;open/&gt;</text>
  <g class="mono" font-size="13" font-weight="500" fill="#adb5bd">
    <text x="640" y="58">Docs</text>
    <text x="716" y="58">API</text>
    <text x="784" y="58">Roadmap</text>
    <text x="890" y="58">Blog</text>
    <text x="956" y="58">GitHub</text>
  </g>
  <rect x="1262" y="34" width="122" height="34" rx="6" fill="#8262db" />
  <text x="1284" y="56" class="mono" font-size="12" font-weight="700"
    fill="#fbf7ff">Get started</text>
  <line x1="0" y1="84.5" x2="1440" y2="84.5" stroke="#ffffff" stroke-opacity="0.08" />

  <text x="72" y="150" class="mono" font-size="12" font-weight="500" fill="#b59cff"
    letter-spacing="3.5">API REFERENCE — SURFACE REGISTRY</text>
  <text x="1368" y="150" class="mono" font-size="11" fill="#868e96"
    text-anchor="end">SNAPSHOT-FROZEN · V0.41.0</text>

  <text x="64" y="290" class="mono" font-size="84" font-weight="800" fill="#f3eaff"
    letter-spacing="-4">FIVE-PACKAGE</text>
  <text x="64" y="380" class="serif" font-size="92" font-style="italic"
    fill="#b59cff">surface.</text>

  <!-- registry table -->
  <g>
    <line x1="0" y1="450.5" x2="1440" y2="450.5" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="72" y="486" class="mono" font-size="10.5" fill="#868e96"
      letter-spacing="2">PACKAGE</text>
    <text x="700" y="486" class="mono" font-size="10.5" fill="#868e96"
      letter-spacing="2">SUPPORTED SUBPATHS</text>
    <text x="1150" y="486" class="mono" font-size="10.5" fill="#868e96"
      letter-spacing="2">KIND</text>
    <line x1="0" y1="504.5" x2="1440" y2="504.5" stroke="#ffffff" stroke-opacity="0.08" />

    <text x="72" y="596" class="mono" font-size="34" font-weight="800" fill="#b59cff"
      letter-spacing="-1">element</text>
    <text x="72" y="628" class="mono" font-size="11.5"
      fill="#adb5bd">Custom Elements · JSX · DSD · signals</text>
    <g class="mono" font-size="11.5" fill="#adb5bd">
      <rect x="700" y="556" width="60" height="26" rx="6" fill="#21143b" />
      <text x="712" y="574">root</text>
      <rect x="770" y="556" width="108" height="26" rx="6" fill="#21143b" />
      <text x="782" y="574">jsx-runtime</text>
      <rect x="888" y="556" width="132" height="26" rx="6" fill="#21143b" />
      <text x="900" y="574">jsx-dev-runtime</text>
      <rect x="700" y="592" width="100" height="26" rx="6" fill="#21143b" />
      <text x="712" y="610">build-utils</text>
    </g>
    <rect x="1150" y="566" width="90" height="30" rx="6" fill="#8262db" />
    <text x="1172" y="586" class="mono" font-size="11" font-weight="700" fill="#fbf7ff">CORE</text>
    <line x1="0" y1="660.5" x2="1440" y2="660.5" stroke="#ffffff" stroke-opacity="0.08" />

    <text x="72" y="752" class="mono" font-size="34" font-weight="800" fill="#b59cff"
      letter-spacing="-1">app</text>
    <text x="72" y="784" class="mono" font-size="11.5"
      fill="#adb5bd">pages · routing · islands · SPA chain</text>
    <g class="mono" font-size="11.5" fill="#adb5bd">
      <rect x="700" y="712" width="60" height="26" rx="6" fill="#21143b" />
      <text x="712" y="730">root</text>
      <rect x="770" y="712" width="66" height="26" rx="6" fill="#21143b" />
      <text x="782" y="730">hono</text>
      <rect x="846" y="712" width="72" height="26" rx="6" fill="#21143b" />
      <text x="858" y="730">model</text>
      <rect x="928" y="712" width="58" height="26" rx="6" fill="#21143b" />
      <text x="940" y="730">spa</text>
      <rect x="996" y="712" width="80" height="26" rx="6" fill="#21143b" />
      <text x="1008" y="730">preact</text>
    </g>
    <rect x="1150" y="722" width="90" height="30" rx="6" fill="#8262db" />
    <text x="1172" y="742" class="mono" font-size="11" font-weight="700" fill="#fbf7ff">CORE</text>
    <line x1="0" y1="816.5" x2="1440" y2="816.5" stroke="#ffffff" stroke-opacity="0.08" />

    <text x="72" y="908" class="mono" font-size="34" font-weight="800" fill="#b59cff"
      letter-spacing="-1">adapter-vite</text>
    <text x="72" y="940" class="mono" font-size="11.5"
      fill="#adb5bd">Vite · content · SSG · Nitro output</text>
    <g class="mono" font-size="11.5" fill="#adb5bd">
      <rect x="700" y="868" width="60" height="26" rx="6" fill="#21143b" />
      <text x="712" y="886">root</text>
      <rect x="770" y="868" width="108" height="26" rx="6" fill="#21143b" />
      <text x="782" y="886">nitro-mount</text>
      <rect x="888" y="868" width="86" height="26" rx="6" fill="#21143b" />
      <text x="900" y="886">cli/build</text>
      <rect x="984" y="868" width="80" height="26" rx="6" fill="#21143b" />
      <text x="996" y="886">sitemap</text>
    </g>
    <rect x="1150" y="878" width="90" height="30" rx="6" fill="#21143b" stroke="#58399e" />
    <text x="1168" y="898" class="mono" font-size="11" font-weight="700" fill="#b59cff">BUILD</text>
    <line x1="0" y1="972.5" x2="1440" y2="972.5" stroke="#ffffff" stroke-opacity="0.08" />

    <text x="72" y="1064" class="mono" font-size="34" font-weight="800" fill="#b59cff"
      letter-spacing="-1">create</text>
    <text x="72" y="1096" class="mono" font-size="11.5"
      fill="#adb5bd">installed starter · exact-version entry</text>
    <g class="mono" font-size="11.5" fill="#adb5bd">
      <rect x="700" y="1024" width="60" height="26" rx="6" fill="#21143b" />
      <text x="712" y="1042">root</text>
      <rect x="770" y="1024" width="86" height="26" rx="6" fill="#21143b" />
      <text x="782" y="1042">CLI only</text>
    </g>
    <rect x="1150" y="1034" width="90" height="30" rx="6" fill="#21143b" stroke="#58399e" />
    <text x="1168" y="1054" class="mono" font-size="11" font-weight="700"
      fill="#b59cff">BUILD</text>
    <line x1="0" y1="1128.5" x2="1440" y2="1128.5" stroke="#ffffff" stroke-opacity="0.08" />

    <text x="72" y="1220" class="mono" font-size="34" font-weight="800" fill="#adb5bd"
      letter-spacing="-1">ui</text>
    <text x="72" y="1252" class="mono" font-size="11.5"
      fill="#adb5bd">10 proven primitives · optional</text>
    <g class="mono" font-size="11.5" fill="#adb5bd">
      <rect x="700" y="1180" width="60" height="26" rx="6" fill="#21143b" />
      <text x="712" y="1198">root</text>
      <rect x="770" y="1180" width="108" height="26" rx="6" fill="#21143b" />
      <text x="782" y="1198">open-button</text>
      <rect x="888" y="1180" width="88" height="26" rx="6" fill="#21143b" />
      <text x="900" y="1198">open-card</text>
      <rect x="986" y="1180" width="130" height="26" rx="6" fill="#21143b" />
      <text x="998" y="1198">+ 8 primitives</text>
    </g>
    <rect x="1150" y="1190" width="110" height="30" rx="6" fill="none" stroke="#58399e"
      stroke-dasharray="4 4" />
    <text x="1164" y="1210" class="mono" font-size="11" font-weight="700"
      fill="#adb5bd">OPTIONAL</text>
    <line x1="0" y1="1284.5" x2="1440" y2="1284.5" stroke="#ffffff" stroke-opacity="0.1" />
  </g>

  <!-- footnote -->
  <g>
    <text x="72" y="1350" class="mono" font-size="12"
      fill="#868e96">※ Internal subpaths (adapter-vite build pipeline, element hydration modules) stay importable for tooling but</text>
    <text x="72" y="1374" class="mono" font-size="12"
      fill="#868e96">carry no compatibility promise. The public type surface is explicit — no export-star seams since alpha.19.</text>
    <text x="72" y="1430" class="mono" font-size="12"
      fill="#868e96">Machine-checked against each package's exports map by </text>
    <text x="546" y="1430" class="mono" font-size="12"
      fill="#b59cff">deno task package-surface:check</text>
    <text x="72" y="1466" class="mono" font-size="12" fill="#868e96">MIT · v0.41.0</text>
  </g>
</svg>
