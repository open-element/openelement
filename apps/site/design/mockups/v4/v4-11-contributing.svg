<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1320" viewBox="0 0 1440 1320">
  <defs>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500;700;800&amp;display=swap');
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .serif {
      font-family: 'Instrument Serif', serif;
    }
    </style>
    <pattern id="ctGrid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M 72 0 L 0 0 0 72" fill="none" stroke="#ffffff" stroke-opacity="0.035"
        stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1440" height="1320" fill="#0a0714" />
  <rect width="1440" height="1320" fill="url(#ctGrid)" />

  <text x="72" y="62" class="mono" font-size="20" font-weight="800"
    fill="#f3eaff">&lt;open/&gt;</text>
  <g class="mono" font-size="13" font-weight="500" fill="#adb5bd">
    <text x="640" y="58">Docs</text>
    <text x="716" y="58">API</text>
    <text x="784" y="58">Roadmap</text>
    <text x="890" y="58">Blog</text>
    <text x="956" y="58">GitHub</text>
  </g>
  <rect x="1262" y="34" width="122" height="34" rx="6" fill="#8262db" />
  <text x="1284" y="56" class="mono" font-size="12" font-weight="700"
    fill="#fbf7ff">Get started</text>
  <line x1="0" y1="84.5" x2="1440" y2="84.5" stroke="#ffffff" stroke-opacity="0.08" />

  <text x="72" y="150" class="mono" font-size="12" font-weight="500" fill="#b59cff"
    letter-spacing="3.5">CONTRIBUTING — JOIN THE LAB</text>

  <text x="64" y="290" class="mono" font-size="84" font-weight="800" fill="#f3eaff"
    letter-spacing="-4">BUILD IT</text>
  <text x="64" y="380" class="serif" font-size="92" font-style="italic"
    fill="#b59cff">with us.</text>

  <!-- setup terminal -->
  <g>
    <rect x="72" y="440" width="680" height="220" rx="12" fill="#100a1c" stroke="#ffffff"
      stroke-opacity="0.09" />
    <line x1="72" y1="441" x2="752" y2="441" stroke="#b59cff" stroke-opacity="0.55" />
    <circle cx="100" cy="468" r="5" fill="#ff5f57" />
    <circle cx="120" cy="468" r="5" fill="#febc2e" />
    <circle cx="140" cy="468" r="5" fill="#28c840" />
    <text x="164" y="472" class="mono" font-size="11" fill="#868e96">setup.sh</text>
    <text x="100" y="516" class="mono" font-size="13.5" fill="#4ade80">$ </text>
    <text x="120" y="516" class="mono" font-size="13.5"
      fill="#e9ecef">git clone open-element/openelement</text>
    <text x="100" y="556" class="mono" font-size="13.5" fill="#4ade80">$ </text>
    <text x="120" y="556" class="mono" font-size="13.5" fill="#e9ecef">deno install --frozen</text>
    <text x="100" y="596" class="mono" font-size="13.5" fill="#4ade80">$ </text>
    <text x="120" y="596" class="mono" font-size="13.5" fill="#e9ecef">deno task test </text>
    <text x="290" y="596" class="mono" font-size="12" fill="#868e96"># 942 passing</text>
    <text x="100" y="636" class="mono" font-size="13.5" fill="#4ade80">$ </text>
    <text x="120" y="636" class="mono" font-size="13.5" fill="#e9ecef">deno task dev </text>
    <text x="280" y="636" class="mono" font-size="12" fill="#868e96"># the site itself</text>
  </g>

  <!-- checklist clauses -->
  <g>
    <text x="860" y="480" class="mono" font-size="13" font-weight="700" fill="#8262db"
      letter-spacing="3">BEFORE A PR</text>
    <g>
      <rect x="860" y="516" width="18" height="18" rx="4" fill="#8262db" />
      <text x="864" y="530" class="mono" font-size="12" font-weight="800" fill="#fbf7ff">✓</text>
      <text x="896" y="531" class="mono" font-size="13"
        fill="#adb5bd">Read PROJECT_WORKFLOW.md first</text>
      <rect x="860" y="556" width="18" height="18" rx="4" fill="#8262db" />
      <text x="864" y="570" class="mono" font-size="12" font-weight="800" fill="#fbf7ff">✓</text>
      <text x="896" y="571" class="mono" font-size="13"
        fill="#adb5bd">One public contract per surface</text>
      <rect x="860" y="596" width="18" height="18" rx="4" fill="#8262db" />
      <text x="864" y="610" class="mono" font-size="12" font-weight="800" fill="#fbf7ff">✓</text>
      <text x="896" y="611" class="mono" font-size="13"
        fill="#adb5bd">Gates green locally, evidence in the PR</text>
      <rect x="860" y="636" width="18" height="18" rx="4" fill="none" stroke="#58399e" />
      <text x="896" y="651" class="mono" font-size="13"
        fill="#adb5bd">Architectural change? Write the ADR</text>
    </g>
  </g>

  <!-- where to help rows -->
  <g>
    <text x="72" y="760" class="mono" font-size="13" font-weight="700" fill="#8262db"
      letter-spacing="3">WHERE TO HELP</text>
    <line x1="0" y1="790.5" x2="1440" y2="790.5" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="72" y="850" class="mono" font-size="44" font-weight="800" fill="none" stroke="#58399e"
      stroke-width="1.2">01</text>
    <text x="220" y="842" class="mono" font-size="20" font-weight="800"
      fill="#f3eaff">Third-party WC corpus</text>
    <text x="820" y="830" class="mono" font-size="12.5"
      fill="#adb5bd">Lit / FAST / Stencil components that render</text>
    <text x="820" y="854" class="mono" font-size="12.5"
      fill="#adb5bd">through our DSD pipeline, with evidence.</text>
    <line x1="0" y1="890.5" x2="1440" y2="890.5" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="72" y="950" class="mono" font-size="44" font-weight="800" fill="none" stroke="#58399e"
      stroke-width="1.2">02</text>
    <text x="220" y="942" class="mono" font-size="20" font-weight="800"
      fill="#f3eaff">Windows verification</text>
    <text x="820" y="930" class="mono" font-size="12.5"
      fill="#adb5bd">The /@fs/ path branch needs real Windows</text>
    <text x="820" y="954" class="mono" font-size="12.5"
      fill="#adb5bd">hardware. One afternoon, one report.</text>
    <line x1="0" y1="990.5" x2="1440" y2="990.5" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="72" y="1050" class="mono" font-size="44" font-weight="800" fill="none" stroke="#58399e"
      stroke-width="1.2">03</text>
    <text x="220" y="1042" class="mono" font-size="20" font-weight="800"
      fill="#f3eaff">Dogfood something real</text>
    <text x="820" y="1030" class="mono" font-size="12.5"
      fill="#adb5bd">Build an application on the stable line and</text>
    <text x="820" y="1054" class="mono" font-size="12.5"
      fill="#adb5bd">file what breaks. That is the pilot now.</text>
    <line x1="0" y1="1090.5" x2="1440" y2="1090.5" stroke="#ffffff" stroke-opacity="0.08" />
  </g>

  <!-- support strip -->
  <g>
    <rect x="72" y="1150" width="1296" height="100" rx="12" fill="#130a22" stroke="#58399e" />
    <rect x="72" y="1150" width="4" height="100" fill="#8262db" />
    <text x="100" y="1190" class="mono" font-size="11" font-weight="700"
      fill="#b59cff">QUESTIONS FIRST</text>
    <text x="100" y="1218" class="mono" font-size="13"
      fill="#adb5bd">GitHub Discussions for usage and design. Issues for reproducible bugs,</text>
    <text x="100" y="1240" class="mono" font-size="13"
      fill="#adb5bd">documentation defects, and agreed proposals.</text>
  </g>
</svg>
