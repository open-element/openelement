<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180">
  <defs>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500;700;800&amp;display=swap');
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .serif {
      font-family: 'Instrument Serif', serif;
    }
    </style>
    <pattern id="dGrid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M 72 0 L 0 0 0 72" fill="none" stroke="#ffffff" stroke-opacity="0.035"
        stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1440" height="1180" fill="#0a0714" />
  <rect width="1440" height="1180" fill="url(#dGrid)" />

  <text x="72" y="62" class="mono" font-size="20" font-weight="800"
    fill="#f3eaff">&lt;open/&gt;</text>
  <g class="mono" font-size="13" font-weight="500" fill="#adb5bd">
    <text x="640" y="58">Docs</text>
    <text x="716" y="58">API</text>
    <text x="784" y="58">Roadmap</text>
    <text x="890" y="58">Blog</text>
    <text x="956" y="58">GitHub</text>
  </g>
  <rect x="1262" y="34" width="122" height="34" rx="6" fill="#8262db" />
  <text x="1284" y="56" class="mono" font-size="12" font-weight="700"
    fill="#fbf7ff">Get started</text>
  <line x1="0" y1="84.5" x2="1440" y2="84.5" stroke="#ffffff" stroke-opacity="0.08" />

  <text x="72" y="150" class="mono" font-size="12" font-weight="500" fill="#b59cff"
    letter-spacing="3.5">DOCS — THE MANUAL</text>
  <text x="1368" y="150" class="mono" font-size="11" fill="#868e96" text-anchor="end">V0.41.0</text>

  <text x="64" y="330" class="serif" font-size="140" font-style="italic" fill="#b59cff"
    letter-spacing="-2">Read the</text>
  <text x="64" y="470" class="mono" font-size="110" font-weight="800" fill="#f3eaff"
    letter-spacing="-6">MANUAL.</text>
  <text x="72" y="530" class="mono" font-size="15"
    fill="#adb5bd">Four entrances. Everything else is a footnote.</text>

  <!-- vertical sidenote -->
  <text x="1396" y="600" class="mono" font-size="11" fill="#868e96" transform="rotate(90 1396 600)"
    letter-spacing="2">SPEC-042 · DOCS INDEX</text>

  <!-- index rows -->
  <g class="mono">
    <line x1="0" y1="590.5" x2="1440" y2="590.5" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="72" y="700" font-size="90" font-weight="800" fill="none" stroke="#58399e"
      stroke-width="1.5">01</text>
    <text x="300" y="680" font-size="34" font-weight="800" fill="#f3eaff">Get started</text>
    <text x="300" y="714" font-size="13"
      fill="#adb5bd">Zero to a running application in three commands.</text>
    <text x="1290" y="690" font-size="30" fill="#58399e">→</text>
    <line x1="0" y1="730.5" x2="1440" y2="730.5" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="72" y="840" font-size="90" font-weight="800" fill="none" stroke="#58399e"
      stroke-width="1.5">02</text>
    <text x="300" y="820" font-size="34" font-weight="800" fill="#f3eaff">API reference</text>
    <text x="300" y="854" font-size="13"
      fill="#adb5bd">The five-package surface, export by export.</text>
    <text x="1290" y="830" font-size="30" fill="#58399e">→</text>
    <line x1="0" y1="870.5" x2="1440" y2="870.5" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="72" y="980" font-size="90" font-weight="800" fill="none" stroke="#58399e"
      stroke-width="1.5">03</text>
    <text x="300" y="960" font-size="34" font-weight="800" fill="#f3eaff">Architecture</text>
    <text x="300" y="994" font-size="13"
      fill="#adb5bd">Who owns what, and why the boundaries hold.</text>
    <text x="1290" y="970" font-size="30" fill="#58399e">→</text>
    <line x1="0" y1="1010.5" x2="1440" y2="1010.5" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="72" y="1120" font-size="90" font-weight="800" fill="none" stroke="#58399e"
      stroke-width="1.5">04</text>
    <text x="300" y="1100" font-size="34" font-weight="800" fill="#f3eaff">Roadmap</text>
    <text x="300" y="1134" font-size="13" fill="#adb5bd">Where the stable line goes next.</text>
    <text x="1290" y="1110" font-size="30" fill="#58399e">→</text>
    <line x1="0" y1="1150.5" x2="1440" y2="1150.5" stroke="#ffffff" stroke-opacity="0.08" />
  </g>
</svg>
