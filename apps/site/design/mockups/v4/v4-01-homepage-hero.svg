<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940">
  <defs>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500;700;800&amp;display=swap');
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .serif {
      font-family: 'Instrument Serif', serif;
    }
    </style>
    <radialGradient id="v3glow" cx="60%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#8262db" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#0a0714" stop-opacity="0" />
    </radialGradient>
    <pattern id="v3grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M 72 0 L 0 0 0 72" fill="none" stroke="#ffffff" stroke-opacity="0.035"
        stroke-width="1" />
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="1440" height="940" fill="#0a0714" />
  <rect width="1440" height="940" fill="url(#v3grid)" />
  <rect width="1440" height="940" fill="url(#v3glow)" />
  <rect width="1440" height="940" filter="url(#grain)" opacity="0.04" />

  <!-- ghost mark watermark, cropped at right edge -->
  <text x="950" y="560" class="mono" font-size="420" font-weight="800" fill="none" stroke="#b59cff"
    stroke-opacity="0.08" stroke-width="1.5" letter-spacing="-20">&lt;open/&gt;</text>

  <!-- nav -->
  <g>
    <text x="72" y="62" class="mono" font-size="20" font-weight="800"
      fill="#f3eaff">&lt;open/&gt;</text>
    <g class="mono" font-size="13" font-weight="500" fill="#adb5bd">
      <text x="640" y="58">Docs</text>
      <text x="716" y="58">API</text>
      <text x="784" y="58">Roadmap</text>
      <text x="890" y="58">Blog</text>
      <text x="956" y="58">GitHub</text>
    </g>
    <rect x="1150" y="34" width="96" height="34" rx="6" fill="none" stroke="#58399e"
      stroke-width="1.5" />
    <text x="1172" y="56" class="mono" font-size="12" font-weight="700"
      fill="#b59cff">v0.41.0</text>
    <rect x="1262" y="34" width="122" height="34" rx="6" fill="#8262db" />
    <text x="1284" y="56" class="mono" font-size="12" font-weight="700"
      fill="#fbf7ff">Get started</text>
    <line x1="0" y1="84.5" x2="1440" y2="84.5" stroke="#ffffff" stroke-opacity="0.08" />
  </g>

  <!-- eyebrow + spec stamp -->
  <g>
    <line x1="72" y1="150" x2="104" y2="150" stroke="#8262db" stroke-width="2" />
    <text x="116" y="155" class="mono" font-size="13" font-weight="500" fill="#b59cff"
      letter-spacing="3.5">OPENELEMENT — WEB STANDARDS LAB</text>
    <text x="1368" y="155" class="mono" font-size="12" fill="#868e96" text-anchor="end"
      letter-spacing="1">EST. 2026 / SPEC-042</text>
  </g>

  <!-- giant kinetic headline -->
  <g>
    <text x="64" y="368" class="mono" font-size="150" font-weight="800" fill="#f3eaff"
      letter-spacing="-7">THE WEB,</text>
    <text x="424" y="586" class="serif" font-size="216" font-style="italic" fill="#b59cff"
      letter-spacing="-4">composed.</text>
  </g>

  <!-- lede -->
  <g>
    <text x="72" y="668" class="mono" font-size="16.5"
      fill="#adb5bd">A Web Components-native application framework — beautiful,</text>
    <text x="72" y="698" class="mono" font-size="16.5"
      fill="#adb5bd">static-first applications composed from real browser primitives.</text>
    <g>
      <rect x="72" y="734" width="176" height="52" rx="6" fill="#8262db" />
      <text x="108" y="767" class="mono" font-size="14.5" font-weight="700"
        fill="#fbf7ff">Start building</text>
      <rect x="264" y="734" width="196" height="52" rx="6" fill="none" stroke="#58399e"
        stroke-width="1.5" />
      <text x="296" y="767" class="mono" font-size="14.5" font-weight="500"
        fill="#e9ecef">Watch it unfold</text>
    </g>
  </g>

  <!-- spec strip: full-width hairline table pinned above marquee -->
  <g>
    <line x1="0" y1="810.5" x2="1440" y2="810.5" stroke="#ffffff" stroke-opacity="0.08" />
    <g class="mono">
      <text x="72" y="838" font-size="10.5" fill="#868e96" letter-spacing="2">VERSION</text>
      <text x="72" y="868" font-size="17" font-weight="800" fill="#f3eaff">v0.41.0 — stable</text>
      <line x1="330" y1="826" x2="330" y2="878" stroke="#ffffff" stroke-opacity="0.08" />
      <text x="372" y="838" font-size="10.5" fill="#868e96" letter-spacing="2">GRAPH</text>
      <text x="372" y="868" font-size="17" font-weight="800" fill="#f3eaff">five packages</text>
      <line x1="640" y1="826" x2="640" y2="878" stroke="#ffffff" stroke-opacity="0.08" />
      <text x="682" y="838" font-size="10.5" fill="#868e96" letter-spacing="2">ENGINES</text>
      <text x="682" y="868" font-size="17" font-weight="800" fill="#f3eaff">3 in CI</text>
      <line x1="880" y1="826" x2="880" y2="878" stroke="#ffffff" stroke-opacity="0.08" />
      <text x="922" y="838" font-size="10.5" fill="#868e96" letter-spacing="2">FRAMEWORK DEPS</text>
      <text x="922" y="868" font-size="17" font-weight="800" fill="#b59cff">zero</text>
      <line x1="1150" y1="826" x2="1150" y2="878" stroke="#ffffff" stroke-opacity="0.08" />
      <text x="1192" y="838" font-size="10.5" fill="#868e96" letter-spacing="2">SERVER OUTPUT</text>
      <text x="1192" y="868" font-size="17" font-weight="800" fill="#f3eaff">DSD default</text>
    </g>
  </g>

  <!-- standards marquee band -->
  <g>
    <rect x="0" y="896" width="1440" height="44" fill="#0d0918" />
    <line x1="0" y1="896.5" x2="1440" y2="896.5" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="36" y="924" class="mono" font-size="14" font-weight="500" fill="#8262db"
      letter-spacing="2">CUSTOM ELEMENTS ✳ SHADOW DOM ✳ DECLARATIVE SHADOW DOM ✳ ES MODULES ✳ SIGNALS ✳ HTML FIRST ✳ CUSTOM ELEMENTS ✳ SHADOW DOM ✳ DSD ✳</text>
  </g>
</svg>
