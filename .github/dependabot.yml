# Dependabot supports GitHub Actions but not the pnpm workspace lockfile;
# the former Deno-side dependency-audit workflow retired with the B2 manifest
# conversion (the single pnpm-lock.yaml carries dependency resolution, and
# pnpm-workspace.yaml enforces minimumReleaseAge as the supply-chain guard).
# Dependency update PRs are human-authored and run the full CI gate.
# No auto-merge anywhere.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      # zizmor dependabot-cooldown (#1156 B2.6): let fresh action releases
      # bake for a week before Dependabot proposes them.
      default-days: 7
    open-pull-requests-limit: 5
