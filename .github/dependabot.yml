# Dependabot supports GitHub Actions but not the Deno workspace/lockfile.
# npm/jsr dependencies are covered by the scheduled dependency-audit workflow
# (.github/workflows/dependency-audit.yml); update PRs are human-authored and
# run the full CI gate. No auto-merge anywhere.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      # zizmor dependabot-cooldown (#1156 B2.6): let fresh action releases
      # bake for a week before Dependabot proposes them.
      default-days: 7
    open-pull-requests-limit: 5
