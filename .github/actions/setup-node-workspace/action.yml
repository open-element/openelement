name: Setup Node Workspace
description: Install the Node toolchain and pnpm, restore workspace dependencies, and materialize node_modules.

runs:
  using: composite
  steps:
    # v4.4.0 — resolves the toolchain from .node-version (the repo's single
    # toolchain pin since the B4 CI swap retired .dvmrc with the Deno host).
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version-file: .node-version
    # TRANSITIONAL (B4 review fix): the task surface above is node/pnpm only,
    # but the release-lane tooling beneath it still enters through `deno run`
    # (the tools/release package.json entries, the packaged-consumer
    # harnesses, and the fixture qualify scripts). CI keeps the deno host —
    # pinned at the retired .dvmrc version 2.9.0 so behavior is identical to
    # the pre-B4 runner — until the release-lane port pivots those entries to
    # node and deletes this step.
    # v2.0.5
    - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
      with:
        deno-version: 2.9.0
    # pnpm owns dependency resolution and the task surface since the B2
    # manifest conversion (single pnpm-lock.yaml) and the B4 CI swap.
    - name: Install pnpm
      shell: bash
      run: npm install -g pnpm@12
    - name: Cache dependencies
      # v4.3.0
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: node_modules
        key: ${{ runner.os }}-pnpm-${{ hashFiles('.node-version') }}-${{ hashFiles('pnpm-lock.yaml') }}
    - name: Install dependencies
      shell: bash
      run: |
        pnpm install --frozen-lockfile
        git diff --exit-code -- pnpm-lock.yaml
