name: Install browsers
description: >-
  The one browser-install implementation for every lane: cache the Playwright
  browser directory, then install the requested engines with a bounded retry so
  an apt/network wobble does not fail a required check.

inputs:
  engines:
    description: Space-separated Playwright engine list.
    required: false
    default: chromium firefox webkit
  with-deps:
    description: >-
      Pass `--with-deps` on Linux. Needed whenever the lane runs WebKit or the packed
      starter on Linux (host libraries such as libgtk-4/gstreamer are not in
      the plain browser download).
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # Cache the browser binaries only. Before this action existed the cache
    # step lived in one job and six other install sites ran uncached and
    # unretried: the 2026-11-11 main-push failures (run 43060765423) were one
    # apt mirror failure turning six jobs red at once.
    - name: Cache Playwright browsers
      # v4.3.0 — the pin `setup-node-workspace` already uses.
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        # Playwright's browser cache lives at a different path per OS.
        path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
        # The engine list is part of the key so a lane that later asks for
        # WebKit cannot restore a chromium-only tree.
        key: ${{ runner.os }}-playwright-${{ inputs.engines }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-playwright-${{ inputs.engines }}-
          ${{ runner.os }}-playwright-
    - name: Install browsers
      # 2026-11-06 failure shape (run 42207927084): one `playwright install
      # --with-deps` call stalled in apt/network for the whole job timeout.
      # Each attempt gets 10 minutes and a 10-second termination grace period.
      # Three attempts absorb transient apt or download failures.
      shell: bash
      env:
        ENGINES: ${{ inputs.engines }}
        WITH_DEPS: ${{ inputs.with-deps }}
      run: |
        set -euo pipefail
        set -f
        # ENGINES is a space-separated list, not shell syntax or glob patterns.
        # shellcheck disable=SC2086
        set -- ${ENGINES}
        install_linux_deps=false
        if [ "${RUNNER_OS}" = "Linux" ] && [ "${WITH_DEPS}" = "true" ]; then
          install_linux_deps=true
          set -- --with-deps "$@"
        fi
        for attempt in 1 2 3; do
          if [ "${install_linux_deps}" = "true" ]; then
            # Recover dpkg after a timed-out Linux dependency install.
            sudo fuser -k /var/lib/dpkg/lock-frontend 2>/dev/null || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock || true
            sudo dpkg --configure -a || true
          fi
          if node "${GITHUB_ACTION_PATH}/run-attempt.mjs" 600000 10000 ./node_modules/.bin/playwright install "$@"; then
            exit 0
          fi
          if [ "${attempt}" -eq 3 ]; then break; fi
          echo "::warning::playwright install attempt ${attempt}/3 failed; retrying"
          # GitHub's Ubuntu runner can keep returning successful but very slow
          # downloads from its regional EC2 mirror (#1805). Switch to Ubuntu's
          # primary archive on retry, keeping the image's other mirror entries
          # and the existing signed source configuration.
          mirror_list=/etc/apt/apt-mirrors.txt
          if [ "${install_linux_deps}" = "true" ] && [ -f "${mirror_list}" ] &&
             grep -q '\.ec2\.archive\.ubuntu\.com/ubuntu' "${mirror_list}"; then
            echo "Retrying Ubuntu dependencies via archive.ubuntu.com"
            sudo sed -Ei 's@https?://[[:alnum:]-]+\.ec2\.archive\.ubuntu\.com/ubuntu@https://archive.ubuntu.com/ubuntu@g' "${mirror_list}"
          fi
          sleep 10
        done
        echo "::error::playwright install failed after 3 attempts (${ENGINES})"
        exit 1
