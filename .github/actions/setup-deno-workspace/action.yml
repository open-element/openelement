name: Setup Deno Workspace
description: Install the Deno test-runner host and pnpm, restore workspace dependencies, and materialize node_modules.

runs:
  using: composite
  steps:
    # v2.0.5
    - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
      with:
        deno-version-file: .dvmrc
    # pnpm owns dependency resolution since the B2 manifest conversion
    # (single pnpm-lock.yaml); deno stays as the test-runner host and resolves
    # the @jsr/* npm mirrors out of the same node_modules tree.
    - name: Install pnpm
      shell: bash
      run: npm install -g pnpm@12
    - name: Cache dependencies
      # v4.3.0
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: node_modules
        key: ${{ runner.os }}-pnpm-${{ hashFiles('.dvmrc') }}-${{ hashFiles('pnpm-lock.yaml') }}
    - name: Install dependencies
      shell: bash
      run: |
        pnpm install --frozen-lockfile
        git diff --exit-code -- pnpm-lock.yaml
