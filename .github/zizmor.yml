# zizmor configuration (#1156 B2.6). Findings are fixed, not suppressed; the
# only disabled audit is a repository-local path style preference, plus
# line-scoped audited exceptions below.
rules:
  self-repository:
    disable: true
  dangerous-triggers:
    ignore:
      # Audited 2026-10-07 (#1566 CI redesign): autoflow-release.yml uses
      # `on: workflow_run` for auto-release. The escalation vector is
      # structurally absent: workflow_run evaluates the default-branch copy
      # (a PR cannot rewrite release logic), checkout pins head_sha (not
      # PR head), and the environment gate (openelement-release) binds
      # human approval + OIDC provenance. Re-pinned to the `on:` block's new
      # line when the manual re-point dispatch widened the trigger.
      - autoflow-release.yml:15
  template-injection:
    ignore:
      # Audited 2026-10-07: the version-reading step interpolates
      # head_sha via env (not template expansion in the run script);
      # this is the safe pattern zizmor recommends. The finding is a
      # false positive on the run block that reads the env variable.
      # Re-pinned when the manual re-point dispatch shifted the step down.
      - autoflow-release.yml:64
  github-env:
    ignore:
      # Audited 2026-10-07: GITHUB_OUTPUT writes are from a pinned
      # package.json version string and a SHA hex — neither can contain
      # newlines or shell metacharacters. This is the documented safe
      # pattern for step-to-step output propagation.
      # Re-pinned when the manual re-point dispatch shifted the step down.
      - autoflow-release.yml:64
