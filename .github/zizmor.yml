# zizmor configuration (#1156 B2.6). Findings are fixed, not suppressed; the
# only disabled audit is a repository-local path style preference. The former
# line-scoped `dangerous-triggers` exception for autoflow-release.yml retired
# with the trigger itself (Q-Release, 2026-10-13): the workflow no longer
# carries `on: workflow_run`, its only trigger is workflow_dispatch, and the
# explicit publish path is guarded in-file (ci-evidence + release-gate +
# openelement-release environment approval).
rules:
  self-repository:
    disable: true
