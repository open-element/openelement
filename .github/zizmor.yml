# zizmor configuration (#1156 B2.6). Findings are fixed, not suppressed; the
# only disabled audit is a repository-local path style preference, plus
# line-scoped audited exceptions below.
rules:
  self-repository:
    # The repository standardizes on the `./.github/...` local-action form;
    # The `$/` prefix would add a second convention without new evidence.
    disable: true
  dangerous-triggers:
    ignore:
      # Audited 2026-10-07 (#1566 CI redesign): autoflow-release.yml's
      # `on: workflow_run` trigger — the auto-release mechanism. The
      # escalation vector the audit guards is structurally absent:
      # workflow_run evaluates the default-branch copy of this file (a
      # PR cannot rewrite the release logic), the checkout pins
      # workflow_run.head_sha (not PR head), and the environment gate
      # (openelement-release) binds human approval + OIDC provenance.
      # Scoped to this exact line; the audit stays live everywhere else.
      - autoflow-release.yml:7
