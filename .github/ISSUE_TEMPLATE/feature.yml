name: Feature
description: Propose scoped Element or Router product work.
title: '[Feature]: '
body:
  - type: markdown
    attributes:
      value: 'Read `CONTRIBUTING.md`, `docs/architecture/README.md`, and the active ADR index before filing.'
  - type: input
    id: version
    attributes:
      label: Target version
      description: Example: 1.0 Alpha or a named maintenance line.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Describe the concrete behavior to implement.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Required evidence
      description: List tests, docs, gates, fixtures, or CI proof.
