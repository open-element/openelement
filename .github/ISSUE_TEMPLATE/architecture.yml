name: Architecture
description: Propose an ADR-level architecture decision.
title: '[ADR]: '
body:
  - type: markdown
    attributes:
      value: 'Read `CONTRIBUTING.md` and the current architecture before proposing a hard-to-reverse decision.'
  - type: input
    id: adr
    attributes:
      label: ADR file
      description: Proposed or existing ADR path.
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Decision
    validations:
      required: true
  - type: textarea
    id: consequences
    attributes:
      label: Consequences
