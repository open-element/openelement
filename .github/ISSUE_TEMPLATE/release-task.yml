name: Release Task
description: Track a version release to completion.
title: '[Release]: '
body:
  - type: markdown
    attributes:
      value: 'Release work must follow `docs/maintainers/releasing.md` and bind evidence to one exact candidate SHA.'
  - type: input
    id: version
    attributes:
      label: Version
      description: Example: v1.0.0-alpha.1
    validations:
      required: true
  - type: textarea
    id: gates
    attributes:
      label: Gates
      description: Local and CI gates required before merge/tag.
