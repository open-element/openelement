name: Documentation
description: Track documentation work tied to a version or ADR.
title: '[Docs]: '
body:
  - type: markdown
    attributes:
      value: 'Documentation must describe current Element/Router truth or provide a thin map to Git history.'
  - type: input
    id: version
    attributes:
      label: Version or ADR
  - type: textarea
    id: pages
    attributes:
      label: Pages to update
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Proof required
      description: Relevant code, package, link, or rendered-document proof.
