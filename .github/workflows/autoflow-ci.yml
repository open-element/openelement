name: AutoFlow CI

# Redesigned 2026-10-07 (#1566): 4 parallel jobs replace the 12-job evidence
# aggregation system. PR feedback target: 8-12 minutes. Full 3-engine e2e and
# cold-install verification run on main push, not on every PR.
#
# What was removed and why (docs in issue #1566):
# - fresh-clone (28 min, 80% redundant) → split into e2e job + main-push jobs
# - tree-SHA reuse resolver (~200 YAML + ~500 tool lines) → CI is fast enough
# - evidence aggregator with hash recomputation → GitHub checks are the evidence
# - requeue-once → flaky tests get fixed, not auto-retried
# - 45-step release gate → distributed to PR (here) and main push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint & Security ─────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Workflow lint (actionlint)
        run: |
          curl -sSfL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color
      - name: Security audit (zizmor)
        run: |
          pip install zizmor
          zizmor --offline .github
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --verbose .
      - uses: ./.github/actions/setup-node-workspace
      - name: Fast checks (fmt, lint, typecheck, markdown)
        run: vp run check

  # ── Job 2: Unit Tests + Browser Gate ───────────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Unit tests (element, router, create, ui)
        run: |
          vp run --fail-if-no-match @openelement/element#test
          vp run --fail-if-no-match @openelement/router#test
      - name: Browser gate (chromium)
        run: vp run --fail-if-no-match @openelement/element#browser:gate
      - name: Interface snapshot check
        run: vp run generate:all

  # ── Job 3: Site E2E (chromium, sharded) ────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Build site
        run: vp run site:build
      - name: Site E2E (chromium)
        run: vp run --fail-if-no-match @openelement/www#e2e:chromium
      - name: Light-probe E2E (chromium)
        run: vp run --fail-if-no-match @openelement/fixture-site-light-probe#e2e

  # ── Job 4: Pack & Consumer Verification ────────────────────────────────
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Pack dry-run
        run: vp run --fail-if-no-match @openelement/tools-release pack:dry-run
      - name: Pack-surface check
        run: vp run --fail-if-no-match @openelement/tools-release pack-surface:check
      - name: Packed consumer (ubuntu)
        run: vp run --fail-if-no-match @openelement/tools-release consumer:packaged

  # ── Main push only: Full E2E + Cold Install ────────────────────────────
  # These run only on push to main, not on PRs. PR CI is fast (8-12 min);
  # these are the post-merge safety net (~25 min, non-blocking for merges).
  e2e-full:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
      - name: Install all browser engines
        run: ./node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Build site
        run: vp run site:build
      - name: Site E2E (3 engines)
        run: vp run @openelement/www#e2e:browsers
      - name: Fixture gates
        run: |
          vp run --fail-if-no-match @openelement/fixture-router-native-framework#gate
          vp run --fail-if-no-match @openelement/fixture-router-lit-framework#gate
          vp run --fail-if-no-match @openelement/fixture-router-ui-dogfood#gate
          vp run --fail-if-no-match @openelement/fixture-site-light-probe#gate
      - name: Nitro proofs
        run: |
          vp run --fail-if-no-match @openelement/fixture-router-nitro#proof:node
          vp run --fail-if-no-match @openelement/fixture-router-nitro#proof:workers

  fresh-install:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Fresh install (empty store, no cache)
        run: |
          mkdir -p /tmp/fresh-store /tmp/fresh-cache
          pnpm install --frozen-lockfile \
            --store-dir /tmp/fresh-store \
            --cache-dir /tmp/fresh-cache
      - name: Cold build check
        run: |
          export PATH="/tmp/fresh-store/node_modules/.bin:$PATH"
          npx tsc --noEmit -p packages/element/tsconfig.json
          npx tsc --noEmit -p packages/router/tsconfig.json
