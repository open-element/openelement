name: AutoFlow CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Execution is separated from evidence aggregation:
#   fast-checks / source-matrix / packed / fresh-clone each RUN one slice of
#   the suite and upload their result.json + logs; `autoflow-ci` only reads
#   those artifacts (same SHA/tree, recomputed log hashes) and fails if any
#   input is missing or inconsistent. Nothing re-runs the suite in the
#   aggregation step. The fresh-clone job is isolated with empty DENO_DIR and
#   npm cache. Bun remains an optional, non-blocking compatibility signal.
jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # v5.0.0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high

  fast-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # #1156 R11: test the exact attested SHA — the PR head on
          # pull_request, github.sha on push/workflow_call/workflow_dispatch —
          # never checkout's default synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # #1156 (B2.6): mature OSS governance gates (ADR-0144) — fail fast,
      # before the heavy matrix. Binaries pinned by version + SHA-256;
      # Action revisions and downloaded binaries are pinned in this workflow.
      - name: actionlint (workflow lint)
        run: |
          curl -sSfL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color
      # v0.6.3
      - uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99
        with:
          # Offline audits only: this gate must be deterministic and
          # reproducible locally (`zizmor --offline .github/workflows
          # .github/actions`); network-dependent audits stay out of CI.
          online-audits: false
          advanced-security: false
          version: '1.30.0'
      - name: gitleaks (secret scan)
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --verbose .
      - uses: ./.github/actions/setup-deno-workspace
      # ADR-0144 / #1229 (B2.7): generic toolchain gates are pinned OSS tool
      # steps, not AutoFlow gates.
      - name: Fast checks (fmt, lint, markdown, typecheck)
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: deno task --cwd tools/repo candidate:evidence:fast
      - name: Upload fast-checks evidence
        if: always()
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evidence-fast-checks
          path: .artifacts/ci
          if-no-files-found: ignore
          retention-days: 14

  # Core source matrix for the candidate scope (Element, Router, Create, UI,
  # Site, repo/release tooling). Independently governed apps/saas is NOT here:
  # its build/test/Workers proof are the separate, non-blocking saas-optional
  # job below. Router Nitro Node/Workers fixtures remain the core deploy proof.
  source-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-deno-workspace
      - name: Install Playwright browsers
        # The source matrix's fixture gates run Chromium, Firefox and WebKit.
        run: ./node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Source matrix (unit/integration, Site, Node, Workers, browsers)
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: deno task --cwd tools/repo candidate:evidence:source
      - name: Upload source-matrix evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evidence-source-matrix
          path: .artifacts/ci
          if-no-files-found: ignore
          retention-days: 14

  packed-consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-deno-workspace
      # v7.0.0 — ADR-0154 pins the Alpha node runtime to Node 24 (native
      # URLPattern). The runner default (22) cannot load the packed router.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install Playwright browsers
        # Packed Native/Lit/Starter/Create/UI consumers assert hydration on
        # all three engines.
        run: ./node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Packed consumers (pack, artifact scan, all packed gates, publish dry-run)
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: deno task --cwd tools/repo candidate:evidence:packed
      - name: Upload packed evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evidence-packed
          path: .artifacts/ci
          if-no-files-found: ignore
          retention-days: 14

  fresh-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-deno-workspace
      # v7.0.0 — the clone's own packed gate runs the same Node 24 consumers
      # (ADR-0154); the runner default (22) lacks native URLPattern.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install Playwright browsers
        # The clone's own packed gate runs the three-browser consumers; the
        # browser binaries are reused from the preinstalled HOME cache
        # (disclosed in the fresh-clone manifest), while the clone's DENO_DIR
        # and npm cache start empty.
        run: ./node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Fresh clone (install, check, packed gate, publish dry-run)
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: deno task --cwd tools/repo candidate:evidence:fresh
      - name: Upload fresh-clone evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: evidence-fresh-clone
          path: .artifacts/ci
          if-no-files-found: ignore
          retention-days: 14

  # Candidate evidence aggregation: reads the four job artifacts, verifies one
  # commit/tree, recomputes every log hash from real bytes, and publishes the
  # full bundle (evidence JSON + all logs + tarball manifest + fresh-clone
  # manifest + pack diagnostic summary). It never re-runs the suite.
  autoflow-ci:
    name: AutoFlow CI
    needs: [fast-checks, source-matrix, packed-consumers, fresh-clone]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-deno-workspace
      # v7.0.0
      - name: Download job evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: evidence-*
          path: .artifacts/ci
          merge-multiple: true
      - name: Aggregate candidate evidence
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          deno task --cwd tools/repo candidate:evidence:aggregate
          deno task --cwd tools/repo candidate:evidence:validate
      - name: Upload candidate evidence
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/candidate-evidence.json
            .artifacts/tarball-manifest.json
            .artifacts/pack-diagnostics.json
            .artifacts/tarballs
            .artifacts/ci
          if-no-files-found: error
          retention-days: 14

  # BFCache restore contract (#943). Bundled Playwright Chromium ships
  # --disable-back-forward-cache, so this lane installs the Google Chrome
  # channel and runs headed under xvfb; the launch drops the disabling switch
  # and asserts the direct pageshow.persisted signal. Required for the candidate
  # — it must not become optional while the contract is claimed.
  bfcache-chrome:
    name: BFCache Chrome channel (#943)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-deno-workspace
      - name: Install Chrome channel and xvfb
        run: |
          ./node_modules/.bin/playwright install chrome
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Build the packed starter
        run: deno task --cwd tests/e2e/starter-smoke setup
      - name: BFCache restore (Chrome channel, headed under xvfb)
        run: xvfb-run -a deno task --cwd tests/e2e/starter-smoke test:bfcache

  # The packed deploy artifact must boot under plain Node, not just under
  # the Deno CLI. The runtime floor is Node.js >= 24 (WHATWG URLPattern
  # global): the matrix serves on 24 (lowest supported, required) and 26
  # (Current, required). The below-floor clean-error behavior stays pinned by
  # unit test (packages/router/__tests__/ssg-helpers.test.ts), not by an EOL
  # Node job. Admission proof is packed-world: the harness installs the real
  # pack:dry-run tarballs into an isolated consumer (empty npm cache, no
  # workspace source on the resolution path), builds with the packed CLI, and
  # boots the Nitro server output built from the packed app under plain Node —
  # never a workspace build plus a hand-made shim. Local preview stays on
  # cli/start; the build generates no second production server. This proof
  # lives in these smoke jobs — not in gate:packed — because the main gate
  # job's default node is below the Node >= 24 floor by design.
  node-serve-smoke:
    name: dist/server Node smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # #1156 R11: same exact-SHA expression as every required job.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-deno-workspace
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - name: Pack the release tarballs
        run: deno task --cwd tools/release pack:dry-run
      - name: Packed serve proof under Node ${{ matrix.node }}
        run: deno run --allow-read --allow-write --allow-run --allow-env --allow-net --deny-ffi --no-prompt tools/release/consumer-packaged-node-serve.ts node

  # Independently governed first-party SaaS application. Optional and
  # non-blocking by owner direction: it is not part of the Element/Router Alpha
  # repository candidate, is not a required check, and never gates the
  # candidate or the release graph. No secrets, Supabase, Stripe, or
  # Cloudflare connection is made here — build/test only.
  saas-optional:
    name: SaaS (optional, non-blocking)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-deno-workspace
      - name: SaaS verify + Workers boundary
        run: deno run --allow-run tools/repo/gate.ts saas:verify saas:workers

  # #1228 (B2.5): the deployment guide and PACKAGE_SURFACE.md claim the
  # generated dist/server artifacts run on Bun. A claim that survives only on
  # local evidence is an overclaim, so the packed serve harness — same
  # tarballs, same isolated consumer as the Node legs — boots under a pinned
  # Bun here: real server, real HTTP probes. The harness builds the consumer
  # app with plain node (a build tool, not the serving runtime), so this job
  # sets up Node 24 for the build while Bun remains the serving runtime
  # under test.
  bun-serve-smoke:
    name: dist/server Bun smoke
    # Optional compatibility signal only (1.0 Alpha convergence): Bun is not
    # an Alpha support target, so this job must never block the candidate or
    # the release graph. Enforced by tools/repo/check-ci-contracts.test.ts.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # #1156 R11: same exact-SHA expression as every required job.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-deno-workspace
      - name: Install Bun 1.4.1 (version + SHA-256 pinned)
        run: |
          curl -sSfL -o /tmp/bun.zip \
            https://github.com/oven-sh/bun/releases/download/bun-v1.4.1/bun-linux-x64.zip
          echo "74c1c3bee7cd998500c8f969cd8972355ac6a07207e94a39eece1999b56ffabf  /tmp/bun.zip" | sha256sum -c -
          unzip -q /tmp/bun.zip -d /tmp/bun
          echo "/tmp/bun/bun-linux-x64" >> "$GITHUB_PATH"
      # v7.0.0 — Node 24 is the harness's build tool only; Bun serves.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Pack the release tarballs
        run: deno task --cwd tools/release pack:dry-run
      - name: Packed serve proof under Bun
        run: deno run --allow-read --allow-write --allow-run --allow-env --allow-net --deny-ffi --no-prompt tools/release/consumer-packaged-node-serve.ts bun

  # Pre-publish packed-consumer matrix (1.0 Alpha convergence, item 5).
  # The current-SHA packed tarballs must install into a scratch consumer
  # outside the repo and pass the full external starter lifecycle on Linux,
  # macOS, AND Windows — before any publish. Post-publish registry checks
  # (published-consumers.yml, workflow_dispatch) cannot substitute for this
  # matrix: only current-SHA tarballs prove the candidate shippable.
  packed-consumer-matrix:
    name: packed starter consumer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # #1156 R11: same exact-SHA expression as every required job.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-deno-workspace
      # v7.0.0 — the scratch consumer installs tarballs through npm; Node 24
      # is the deployment floor and the harness's install/build tool here.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install Playwright browsers
        # The packed gates assert island hydration/continuation per packed
        # tarball consumer on Chromium, Firefox and WebKit.
        run: ./node_modules/.bin/playwright install chromium firefox webkit
      - name: Install Playwright system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo ./node_modules/.bin/playwright install-deps chromium firefox webkit
      - name: Pack the release tarballs
        run: deno task --cwd tools/release pack:dry-run
      - name: Fresh packed-starter consumer proof
        run: deno task --cwd tools/release consumer:packaged

  # TypeScript 7 SHADOW gate (1.0 Alpha convergence, "TypeScript 7: split
  # decision"). Non-blocking by design: continue-on-error keeps the run
  # advisory while the TS7 CLI matrix is compared against the packed TS6
  # baseline. This job graduates to a required gate only after a complete
  # matching matrix (typecheck + build + declaration emit, all green and
  # equivalent) — until then gate:ci/gate:release must not reference it.
  ts7-shadow:
    name: TypeScript 7 shadow gate (non-blocking)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # #1156 R11: same exact-SHA expression as every required job.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-deno-workspace
      # v7.0.0 — the shadow consumer runs the TS7 tsc CLI under Node.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: TS7 shadow gate (pack:dry-run + consumer matrix)
        run: deno task --cwd tools/repo gate:ts7:shadow
