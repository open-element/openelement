name: AutoFlow CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # v5.0.0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high

  autoflow-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # #1156 R11: test the exact attested SHA — the PR head on
          # pull_request, github.sha on push/workflow_call/workflow_dispatch —
          # never checkout's default synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # #1156 (B2.6): mature OSS governance gates (ADR-0144) — fail fast,
      # before the heavy matrix. Binaries pinned by version + SHA-256;
      # Action revisions and downloaded binaries are pinned in this workflow.
      - name: actionlint (workflow lint)
        run: |
          curl -sSfL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color
      # v0.6.3
      - uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99
        with:
          # Offline audits only: this gate must be deterministic and
          # reproducible locally (`zizmor --offline .github/workflows
          # .github/actions`); network-dependent audits stay out of CI.
          online-audits: false
          advanced-security: false
          version: '1.30.0'
      - name: gitleaks (secret scan)
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --verbose .
      - uses: ./.github/actions/setup-deno-workspace
      # ADR-0144 / #1229 (B2.7): generic toolchain gates are pinned OSS tool steps, not AutoFlow gates.
      - run: deno fmt --check
      - run: deno lint
      - run: deno task lint:markdown
      - run: deno task typecheck
      - name: Install Playwright browsers
        # All three engines up front: the gate's fixture gates run their
        # suites on Chromium, Firefox and WebKit.
        run: ./node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: OpenElement CI gate
        run: deno task gate:ci
      - name: Bind candidate evidence to this exact SHA
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: deno task candidate:evidence
      - name: Upload candidate evidence
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/candidate-evidence.json
          if-no-files-found: error
          retention-days: 14
      # #1232 (B2.10): e2e failures must be inspectable — the 'github'
      # reporter annotates the run inline, and this step publishes the
      # Playwright HTML report + per-test traces/screenshots on failure.
      - name: Upload Playwright failure artifacts
        if: failure()
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-failure-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e/starter-smoke/test-results
            fixtures/router-request-time/e2e/test-results
            fixtures/router-native-framework/e2e/test-results
            fixtures/router-lit-framework/e2e/test-results
            fixtures/router-ui-dogfood/e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

  # Issue #628 (first slice): the generated dist/server artifact must boot
  # under plain Node, not just under the Deno CLI (#969). The runtime floor
  # is Node.js >= 24 (WHATWG URLPattern global): the matrix serves on 24
  # (lowest supported, required) and 26 (Current, required). The below-floor
  # clean-error behavior stays pinned by unit test
  # (packages/router/__tests__/ssg-helpers.test.ts), not by an EOL Node job.
  # Admission proof is packed-world: the harness installs the real
  # pack:dry-run tarballs into an isolated consumer (empty npm cache, no
  # workspace source on the resolution path), builds with the packed CLI,
  # and boots dist/server/serve.mjs under plain Node — never a workspace
  # build plus a hand-made shim.
  node-serve-smoke:
    name: dist/server Node smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # #1156 R11: same exact-SHA expression as every required job.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-deno-workspace
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - name: Pack the release tarballs
        run: deno task pack:dry-run
      - name: Packed serve proof under Node ${{ matrix.node }}
        run: deno run --allow-read --allow-write --allow-run --allow-env --allow-net tools/consumer-packaged-node-serve.ts node

  # #1228 (B2.5): the deployment guide and PACKAGE_SURFACE.md claim the
  # generated dist/server artifacts run on Bun. A claim that survives only on
  # local evidence is an overclaim, so the packed serve harness — same
  # tarballs, same isolated consumer as the Node legs — boots under a pinned
  # Bun here: real server, real HTTP probes. The harness builds the consumer
  # app with plain node (a build tool, not the serving runtime), so this job
  # sets up Node 24 for the build while Bun remains the serving runtime
  # under test.
  bun-serve-smoke:
    name: dist/server Bun smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # #1156 R11: same exact-SHA expression as every required job.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-deno-workspace
      - name: Install Bun 1.4.1 (version + SHA-256 pinned)
        run: |
          curl -sSfL -o /tmp/bun.zip \
            https://github.com/oven-sh/bun/releases/download/bun-v1.4.1/bun-linux-x64.zip
          echo "74c1c3bee7cd998500c8f969cd8972355ac6a07207e94a39eece1999b56ffabf  /tmp/bun.zip" | sha256sum -c -
          unzip -q /tmp/bun.zip -d /tmp/bun
          echo "/tmp/bun/bun-linux-x64" >> "$GITHUB_PATH"
      # v7.0.0 — Node 24 is the harness's build tool only; Bun serves.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Pack the release tarballs
        run: deno task pack:dry-run
      - name: Packed serve proof under Bun
        run: deno run --allow-read --allow-write --allow-run --allow-env --allow-net tools/consumer-packaged-node-serve.ts bun

  # TypeScript 7 SHADOW gate (1.0 Alpha convergence, "TypeScript 7: split
  # decision"). Non-blocking by design: continue-on-error keeps the run
  # advisory while the TS7 CLI matrix is compared against the packed TS6
  # baseline. This job graduates to a required gate only after a complete
  # matching matrix (typecheck + build + declaration emit, all green and
  # equivalent) — until then gate:ci/gate:release must not reference it.
  ts7-shadow:
    name: TypeScript 7 shadow gate (non-blocking)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # #1156 R11: same exact-SHA expression as every required job.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-deno-workspace
      # v7.0.0 — the shadow consumer runs the TS7 tsc CLI under Node.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: TS7 shadow gate (pack:dry-run + consumer matrix)
        run: deno task gate:ts7:shadow
