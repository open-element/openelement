name: AutoFlow CI

# Redesigned 2026-10-07 (#1566). PR layer: 6 parallel jobs, target 10 min.
# Main push layer: +3 jobs (full e2e, cold install, consumer matrix).
# Full audit trail: PR #1567 review + issue #1566.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint, Security & Governance ────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Workflow lint (actionlint)
        run: |
          curl -sSfL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color
      - name: Security audit (zizmor, pinned)
        run: |
          pip install --user zizmor==1.30.0
          export PATH="$HOME/.local/bin:$PATH"
          # Exit 11 = informational findings (safe fixes only); fail only on medium+
          zizmor --offline .github || [ $? -eq 11 ]
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --verbose .
      - uses: ./.github/actions/setup-node-workspace
      - name: Fast checks (fmt, lint, typecheck, markdown)
        run: vp run check
      - name: Generate all artifacts
        run: vp run generate:all
      - name: Interface snapshot check
        run: vp run --fail-if-no-match @openelement/tools-repo#interface:snapshot
      - name: Governance checks (boundaries, provenance, state machine)
        run: |
          vp run --fail-if-no-match @openelement/tools-repo#esm:boundary-check
          vp run --fail-if-no-match @openelement/tools-repo#signals:check-protocol-boundary
          vp run --fail-if-no-match @openelement/tools-repo#validation:boundary-check
          vp run --fail-if-no-match @openelement/tools-repo#assets:check-provenance
          vp run --fail-if-no-match @openelement/tools-repo#release:state-machine:check
          vp run --fail-if-no-match @openelement/tools-repo#workspace:links:check
          vp run --fail-if-no-match @openelement/tools-repo#deps:vite-check
      - name: Dependency review (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high

  # ── Job 2: Unit Tests + Browser Gate (3 engines) ──────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install all browser engines
        run: ./node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Element tests
        run: vp run --fail-if-no-match @openelement/element#test
      - name: Router tests (includes 3-engine browser tests)
        run: vp run --fail-if-no-match @openelement/router#test
      - name: UI, create and tools tests
        # The review gap: the PR layer ran only element+router, so ui/create/
        # tools reds (style shells, stale schedule assertions) were invisible
        # until the release train. All six product surfaces now gate the PR.
        # The tools suites ride the root vitest "tools" project (the repo
        # package has no aggregate test task by design).
        run: |
          vp run --fail-if-no-match @openelement/ui#test
          vp run --fail-if-no-match @openelement/create#test
          # The tools suites read www's generated data modules (release-line,
          # content) — a fresh checkout carries none until this runs.
          vp run --fail-if-no-match @openelement/www#generate:content
          ./node_modules/.bin/vitest run --project tools
      - name: Element browser gate (full matrix)
        run: vp run --fail-if-no-match @openelement/element#browser:gate

  # ── Job 3: Site E2E (chromium-only in PR; full on main) ───────────────
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
      - name: Install chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Build site
        run: vp run site:build
      - name: WWW unit tests (build-output invariants)
        # The www vitest project asserts on the built site (www/dist), so it
        # needs the Build site step above. After the #1567 redesign no CI lane
        # ran it — only the release train's coverage step did — yet it carries
        # the guards registered in seams.md (#1544 shared element-runtime
        # chunk, #1552 eager-script budget, #1555 pagefind filter).
        run: vp run --fail-if-no-match @openelement/www#test
      - name: Site E2E (chromium only — full 3-engine on main push)
        run: vp run --fail-if-no-match @openelement/www#e2e:chromium
      - name: Light-probe E2E (build fixture first)
        run: |
          vp run --fail-if-no-match @openelement/fixture-site-light-probe#build
          vp run --fail-if-no-match @openelement/fixture-site-light-probe#e2e
      - name: Web component interop
        run: vp run --fail-if-no-match @openelement/fixture-web-component-interop#test

  # ── Job 4: Pack & Consumer Verification ────────────────────────────────
  # 40 minutes (measured): the starter smoke alone runs pack, scaffold,
  # install, SSG build and the bfcache probe; shared runners need 2-3x the
  # local wall clock (runs timed out at exactly 15, then at 25).
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install browsers for packed consumers
        # --with-deps: WebKit needs host libraries (libgtk-4, gstreamer, …)
        # the plain browser download does not bring — the packed starter smoke
        # drives all three engines (the old workflow's install-deps step).
        run: ./node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Pack dry-run
        run: vp run --fail-if-no-match @openelement/tools-release#pack:dry-run
      - name: Pack surface check
        run: vp run --fail-if-no-match @openelement/tools-release#pack-surface:check
      - name: Publish dry-run (no-op against real registry)
        run: vp run --fail-if-no-match @openelement/tools-release#publish:npm:dry-run
      - name: Starter smoke (needs packed workspace)
        run: vp run --fail-if-no-match @openelement/e2e-starter-smoke#gate

  # ── Main push only: Full E2E + BFCache + Node Smoke + Cold Install ────
  e2e-full:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
      - name: Install all browser engines
        run: ./node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Build site
        run: vp run site:build
      - name: Site E2E (3 engines)
        run: vp run @openelement/www#e2e:browsers
      - name: Fixture gates
        run: |
          vp run --fail-if-no-match @openelement/fixture-router-native-framework#gate
          vp run --fail-if-no-match @openelement/fixture-router-lit-framework#gate
          vp run --fail-if-no-match @openelement/fixture-router-ui-dogfood#gate
          vp run --fail-if-no-match @openelement/fixture-router-static-only#build
      - name: Nitro proofs
        run: |
          vp run --fail-if-no-match @openelement/fixture-router-nitro#proof:node
          vp run --fail-if-no-match @openelement/fixture-router-nitro#proof:workers

  bfcache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
      - name: Install Chrome channel and xvfb
        run: |
          ./node_modules/.bin/playwright install chrome
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Build the packed starter
        run: vp run --fail-if-no-match @openelement/e2e-starter-smoke#setup
      - name: BFCache restore (Chrome channel, headed)
        run: xvfb-run -a vp run --fail-if-no-match @openelement/e2e-starter-smoke#test:bfcache

  node-serve-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - name: Pack the release tarballs
        run: vp run --fail-if-no-match @openelement/tools-release#pack:dry-run
      - name: Packed serve proof under Node ${{ matrix.node }}
        run: node tools/release/consumer-packaged-node-serve.ts node

  packed-consumer-matrix:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install browsers
        run: ./node_modules/.bin/playwright install chromium firefox webkit
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo ./node_modules/.bin/playwright install-deps chromium firefox webkit
      - name: Pack the release tarballs
        run: vp run --fail-if-no-match @openelement/tools-release#pack:dry-run
      - name: Fresh packed-starter consumer proof
        run: vp run --fail-if-no-match @openelement/tools-release#consumer:packaged

  fresh-install:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      # The cold-install proof deliberately skips the workspace setup action
      # (whose node_modules cache would defeat it), so pnpm is installed here
      # the same way: exact pin over https against registry.npmjs.org.
      - name: Install pnpm
        run: npm install -g pnpm@12.8.1 # zizmor: ignore[adhoc-packages] — same pin and rationale as the setup action
      - name: Fresh install (empty store)
        # --cache-dir is gone from pnpm 12's install (the error blames
        # --frozen-lockfile but the parser dies on cache-dir); the empty
        # --store-dir alone carries the cold-install proof — the store holds
        # every tarball pnpm would otherwise cache.
        run: |
          mkdir -p /tmp/fresh-store
          pnpm install --frozen-lockfile \
            --store-dir /tmp/fresh-store
      - name: Cold typecheck
        run: |
          npx tsc --noEmit -p packages/element/tsconfig.json
          npx tsc --noEmit -p packages/router/tsconfig.json
