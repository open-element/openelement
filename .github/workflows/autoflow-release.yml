name: Release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Full commit SHA to qualify and publish'
        required: true
      version:
        description: 'Exact package version, for example 1.0.0-alpha.1'
        required: true
      publish:
        description: 'Publish to npm after every qualification gate passes'
        required: false
        default: false
        type: boolean

concurrency:
  group: openelement-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # TEMP (#1425): the packed starter browser matrix is root-cause-tracked
      # separately; the release train's Site E2E (three-engine, release
      # invariant) is NOT skipped — only the consumer-harness starter matrix.
      OPEN_ELEMENT_SKIP_BROWSER_MATRIX: '1'
    # Release authorization contract (docs/maintainers/releasing.md): the
    # named environment binds human approval + OIDC-minted npm provenance.
    # It must exist in the GitHub repo settings with the protections below;
    # without it this job fails closed instead of publishing unreviewed.
    environment: openelement-release
    permissions:
      contents: read
      # The release job finds, reads, and downloads the AutoFlow CI evidence
      # artifact for the candidate SHA. With an explicit permissions map,
      # unlisted scopes are none, so workflow-run and artifact reads require
      # Actions read. No write scope is granted.
      actions: read
      id-token: write
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-deno-workspace
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify exact candidate and version
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(deno eval "console.log(JSON.parse(Deno.readTextFileSync('packages/element/deno.json')).version)")" = "$RELEASE_VERSION"
          test "$(deno eval "console.log(JSON.parse(Deno.readTextFileSync('packages/router/deno.json')).version)")" = "$RELEASE_VERSION"
      # Release accepts only successful, non-expired CI evidence bound to the
      # exact candidate SHA — never a hand-written or copied status. The
      # artifact is validated by recomputing every log/manifest hash.
      - name: Require green CI candidate evidence for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow autoflow-ci.yml \
            --commit "$CANDIDATE_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$run_id" ]; then
            echo "No successful AutoFlow CI run found for $CANDIDATE_SHA" >&2
            exit 1
          fi
          created="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json createdAt --jq '.createdAt')"
          age_days="$(( ( $(date -u +%s) - $(date -u -d "$created" +%s) ) / 86400 ))"
          if [ "$age_days" -gt 14 ]; then
            echo "CI evidence for $CANDIDATE_SHA is $age_days days old (retention window 14)" >&2
            exit 1
          fi
          mkdir -p .artifacts/ci-evidence
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --pattern 'candidate-evidence-*' --dir .artifacts/ci-evidence
          evidence="$(find .artifacts/ci-evidence -name candidate-evidence.json | head -1)"
          test -n "$evidence"
          deno run --allow-read --allow-write --allow-run --allow-env --allow-net \
            --deny-ffi --no-prompt tools/repo/candidate-evidence.ts \
            --validate "$evidence" --expected-sha "$CANDIDATE_SHA" --max-age-days 14
      - name: Verify npm CLI supports Trusted Publishing
        if: inputs.publish
        run: |
          npm_version="$(npm --version)"
          node -e "
            const [major, minor] = process.argv[1].split('.').map(Number);
            if (major < 11 || (major === 11 && minor < 5)) {
              console.error('npm ' + process.argv[1] + ' is too old; Trusted Publishing requires npm >= 11.5.1');
              process.exit(1);
            }
          " "$npm_version"
      - name: Install browser engines
        run: ./node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Qualify candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: deno task release:check
      - name: Publish retained packages
        if: inputs.publish
        run: deno task --cwd tools/release publish:npm
      # Recovery record, not a success proof: publish:npm always writes the
      # receipt (successful, partial, or failed) at .artifacts/release-receipt.json.
      # Upload it even when the publish step failed so a partial publish can be
      # inspected and safely resumed. Fail closed if orchestration ran but no
      # receipt exists.
      - name: Upload release receipt (recovery record)
        if: ${{ always() && inputs.publish }}
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-receipt-${{ inputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/release-receipt.json
          if-no-files-found: error
          retention-days: 30
  # Post-publish consumer qualification is chained automatically after a real
  # publish; a partial publish fails the release job before this runs.
  post-publish-consumers:
    needs: release
    if: inputs.publish
    permissions:
      contents: read
    uses: ./.github/workflows/published-consumers.yml
    with:
      version: ${{ inputs.version }}
