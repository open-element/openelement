name: Release

# Redesigned 2026-10-07 (#1566): auto-triggered by main-push CI success.
# Reads version from package.json, checks all 4 packages for idempotency,
# publishes via OIDC, creates GitHub Release. ~5 minutes.

on:
  workflow_run:
    workflows: [AutoFlow CI]
    types: [completed]
    branches: [main]

concurrency:
  group: openelement-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: openelement-release
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.check.outputs.already_published }}
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Read and verify version (all 4 packages must agree)
        id: version
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          VERSION=$(node -e "console.log(require('./packages/element/package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Publishing @openelement/*@$VERSION from $HEAD_SHA"
          # Four-package consistency (the ten-stamp lesson from #1508)
          node tools/repo/check-release-version.ts "$VERSION"

      - name: Check if all 4 packages already published (idempotent)
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Check ALL packages — partial publish state must NOT skip
          ALL_PUBLISHED=true
          for PKG in element router create ui; do
            RESULT=$(npm view "@openelement/$PKG@$VERSION" version 2>/dev/null || echo "not-found")
            if [ "$RESULT" != "$VERSION" ]; then
              ALL_PUBLISHED=false
              echo "$PKG not yet at $VERSION"
            fi
          done
          if [ "$ALL_PUBLISHED" = "true" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "All 4 packages already at $VERSION — skipping."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack and verify
        if: steps.check.outputs.already_published != 'true'
        run: |
          vp run --fail-if-no-match @openelement/tools-release#pack:dry-run
          vp run --fail-if-no-match @openelement/tools-release#pack-surface:check

      - name: Publish to npm (OIDC trusted publishing)
        if: steps.check.outputs.already_published != 'true'
        run: vp run --fail-if-no-match @openelement/tools-release#publish:npm

      - name: Create GitHub Release
        if: steps.check.outputs.already_published != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ steps.version.outputs.sha }}" \
            --prerelease \
            --title "$VERSION" \
            --generate-notes

  # Post-publish consumer verification (3 OS, from the published registry)
  post-publish-consumers:
    needs: release
    if: needs.release.result == 'success' && needs.release.outputs.published != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/published-consumers.yml
    with:
      version: ${{ needs.release.outputs.version }}
