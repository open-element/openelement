name: Release

# Redesigned 2026-10-07 (#1566): auto-triggered by main-push CI success.
# Reads version from package.json, checks all 4 packages for idempotency,
# publishes via OIDC, creates GitHub Release. ~5 minutes.

on:
  workflow_run:
    workflows: [AutoFlow CI]
    types: [completed]
    branches: [main]

concurrency:
  group: openelement-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: openelement-release
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.check.outputs.already_published }}
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node-workspace
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Read and verify version (all 6 packages must agree)
        id: version
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          VERSION=$(node -e "console.log(require('./packages/element/package.json').version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Publishing @openelement/*@$VERSION from $HEAD_SHA"
          # Six-package consistency (the ten-stamp lesson from #1508)
          node tools/repo/check-release-version.ts "$VERSION"

      - name: Check if all 6 packages already published (idempotent)
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Check ALL six packages — partial publish state must NOT skip
          # (#1557 split: protocol and compiler publish from this line on).
          ALL_PUBLISHED=true
          for PKG in protocol element compiler router create ui; do
            RESULT=$(npm view "@openelement/$PKG@$VERSION" version 2>/dev/null || echo "not-found")
            if [ "$RESULT" != "$VERSION" ]; then
              ALL_PUBLISHED=false
              echo "$PKG not yet at $VERSION"
            fi
          done
          if [ "$ALL_PUBLISHED" = "true" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "All 4 packages already at $VERSION — skipping."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack and verify
        if: steps.check.outputs.already_published != 'true'
        run: |
          vp run --fail-if-no-match @openelement/tools-release#pack:dry-run
          vp run --fail-if-no-match @openelement/tools-release#pack-surface:check

      - name: Publish to npm (OIDC trusted publishing)
        if: steps.check.outputs.already_published != 'true'
        run: vp run --fail-if-no-match @openelement/tools-release#publish:npm

      # dist-tag writes over OIDC trusted publishing need npm >= 12.2.0 (npm docs);
      # the runner's bundled npm is older, so the CLI is pinned in its own step
      # before the re-point below. It cannot ride the re-point step's `run: |`
      # body: there a trailing `# zizmor: ignore[...]` is script text, not a YAML
      # comment, so the adhoc-packages finding would stay unsuppressed.
      - name: Install pinned npm (dist-tag OIDC floor)
        run: npm install -g npm@12.2.0 # zizmor: ignore[adhoc-packages] — pinned exact version; npm dist-tag over trusted publishing requires npm >= 12.2.0 (npm docs), and the runner's bundled npm is older

      # The 1.0 line publishes onto `latest` (owner ruling 2026-10-07). The
      # alias re-point rides trusted publishing's manage-dist-tags permission
      # (checked on each package's trusted-publisher entry); without it the
      # step warns and @alpha stays on its previous release. Best-effort by
      # design: warning, never failure.
      - name: Re-point the alpha channel alias at this version
        if: steps.check.outputs.already_published != 'true'
        run: |
          # Without pipefail the pipeline's exit status came from tee, so an npm
          # dist-tag failure was swallowed and the ::warning:: branch below was
          # unreachable; pipefail surfaces the real exit code while the step
          # stays best-effort (warning, never failure).
          set -o pipefail
          for PKG in protocol element compiler router create ui; do
            if ! npm dist-tag add "@openelement/$PKG@$VERSION" alpha 2>&1 | tee /tmp/disttag.log; then
              echo "::warning::could not re-point alpha alias for $PKG (latest is already set)"
            fi
          done

      - name: Create GitHub Release
        if: steps.check.outputs.already_published != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ steps.version.outputs.sha }}" \
            --prerelease \
            --title "$VERSION" \
            --generate-notes

  # Post-publish consumer verification (3 OS, from the published registry)
  post-publish-consumers:
    needs: release
    if: needs.release.result == 'success' && needs.release.outputs.published != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/published-consumers.yml
    with:
      version: ${{ needs.release.outputs.version }}
