name: Release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Full commit SHA to qualify and publish'
        required: true
      version:
        description: 'Exact package version, for example 1.0.0-alpha.1'
        required: true
      publish:
        description: 'Publish to npm after every qualification gate passes'
        required: false
        default: false
        type: boolean

concurrency:
  group: openelement-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-deno-workspace
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify exact candidate and version
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(deno eval "console.log(JSON.parse(Deno.readTextFileSync('packages/element/deno.json')).version)")" = "$RELEASE_VERSION"
          test "$(deno eval "console.log(JSON.parse(Deno.readTextFileSync('packages/router/deno.json')).version)")" = "$RELEASE_VERSION"
      - name: Verify npm CLI supports Trusted Publishing
        if: inputs.publish
        run: |
          npm_version="$(npm --version)"
          node -e "
            const [major, minor] = process.argv[1].split('.').map(Number);
            if (major < 11 || (major === 11 && minor < 5)) {
              console.error('npm ' + process.argv[1] + ' is too old; Trusted Publishing requires npm >= 11.5.1');
              process.exit(1);
            }
          " "$npm_version"
      - name: Install browser engines
        run: ./node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Qualify candidate
        run: deno task autoflow:release
      - name: Publish retained packages
        if: inputs.publish
        run: deno task publish:npm
