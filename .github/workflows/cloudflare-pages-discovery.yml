name: Cloudflare Pages read-only discovery

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit SHA reviewed for this read-only run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-discovery
  cancel-in-progress: false

jobs:
  discover:
    if: github.ref == 'refs/heads/main' && inputs.expected_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: openelement-release
    steps:
      - name: Read Pages project metadata (no deployment)
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          account = os.environ.get('CF_ACCOUNT', '')
          token = os.environ.get('CF_TOKEN', '')
          if not re.fullmatch(r'[a-fA-F0-9]{32}', account) or not token:
              sys.exit('Required Cloudflare credentials are unavailable or invalid.')
          base = 'https://api.cloudflare.com/client/v4/accounts/' + account + '/pages/projects'

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise urllib.error.HTTPError(req.full_url, code, 'Redirect refused', headers, fp)

          opener = urllib.request.build_opener(NoRedirect())
          max_response_bytes = 1024 * 1024

          def get(url):
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + token})
              try:
                  with opener.open(request, timeout=30) as response:
                      declared = response.headers.get('Content-Length')
                      if declared is not None and (
                              not declared.isdigit() or int(declared) > max_response_bytes):
                          sys.exit('Cloudflare response exceeded the safe read limit.')
                      body = response.read(max_response_bytes + 1)
                      if len(body) > max_response_bytes:
                          sys.exit('Cloudflare response exceeded the safe read limit.')
                      payload = json.loads(body)
              except urllib.error.HTTPError as error:
                  sys.exit('Cloudflare read failed: HTTP ' + str(error.code))
              except SystemExit:
                  raise
              except Exception:
                  sys.exit('Cloudflare read failed (response details withheld).')
              if not isinstance(payload, dict) or payload.get('success') is not True:
                  sys.exit('Cloudflare read was not successful (details withheld).')
              return payload

          # Report only recognised-safe identifiers: build fields can contain
          # inline credentials or machine paths, so they are classified rather
          # than echoed. Full values stay in the Cloudflare console.
          canonical_build_commands = {
              'vp run site:build',
              'pnpm run site:build',
              'vp run pages:build',
              'pnpm run pages:build',
              'pnpm --filter @openelement/www run build',
          }
          canonical_destination_dirs = {'www/dist', 'dist'}
          safe_root_dirs = {'www', '.'}
          branch_pattern = re.compile(r'[A-Za-z0-9._/-]{1,100}')
          domain_pattern = re.compile(r'[a-z0-9.-]{1,253}')

          def classify(value, allowed):
              if not isinstance(value, str) or value.strip() == '':
                  return 'unset'
              return value if value in allowed else 'unrecognized'

          def classify_command(value):
              if not isinstance(value, str) or value.strip() == '':
                  return 'unset'
              normalized = ' '.join(value.split())
              return 'canonical' if normalized in canonical_build_commands else 'unrecognized'

          records = []
          for page in range(1, 101):
              payload = get(base + '?per_page=100&page=' + str(page))
              projects = payload.get('result')
              if not isinstance(projects, list):
                  sys.exit('Unexpected project-list response (details withheld).')
              for project in projects:
                  name = project.get('name')
                  if not isinstance(name, str) or not re.fullmatch(r'[a-z0-9-]+', name):
                      sys.exit('Unexpected project name (details withheld).')
                  domains = get(base + '/' + urllib.parse.quote(name, safe='') + '/domains').get('result')
                  if not isinstance(domains, list):
                      sys.exit('Unexpected domain-list response (details withheld).')
                  build = project.get('build_config') or {}
                  production_branch = project.get('production_branch')
                  domain_names = []
                  for domain in domains:
                      domain_name = domain.get('name')
                      domain_names.append(
                          domain_name
                          if isinstance(domain_name, str) and domain_pattern.fullmatch(domain_name)
                          else 'unrecognized')
                  records.append({
                      'project_name': name,
                      'production_branch': (
                          production_branch
                          if isinstance(production_branch, str)
                          and branch_pattern.fullmatch(production_branch)
                          else 'unrecognized'),
                      'custom_domains': domain_names,
                      'build_metadata': {
                          'build_command': classify_command(build.get('build_command')),
                          'destination_dir': classify(
                              build.get('destination_dir'), canonical_destination_dirs),
                          'root_dir': classify(build.get('root_dir'), safe_root_dirs),
                          'build_caching': build.get('build_caching') is True,
                      },
                  })
              info = payload.get('result_info') or {}
              total_pages = info.get('total_pages')
              if (isinstance(total_pages, int) and page >= total_pages) or len(projects) < 100:
                  break
          else:
              sys.exit('Project-list pagination exceeded the safe bound.')
          # Never print full API objects: these can contain deployment env vars.
          print(json.dumps({'pages_projects': records}, ensure_ascii=True, indent=2))
          PY
