name: Re-point channel dist-tags

# Owner-run tool: point a channel dist-tag (default the `alpha` alias) at a
# published version for every package in the 1.0 line. It exists because the
# Release workflow's OIDC identity cannot write dist-tags (E401): the alias
# re-point there is best-effort and warns, so a manual dispatch is the backstop
# that repairs @alpha after a release (see docs/release/release-state.json).
# Auth rides the same OIDC trusted-publishing path as autoflow-release.yml's
# alias step — npm picks the OIDC identity up inside Actions; no npm token
# secret is involved.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Channel dist-tag to re-point
        required: false
        default: alpha
        type: string
      version:
        description: Published version to point the tag at (empty = packages/element/package.json)
        required: false
        default: ''
        type: string

# contents: read is checkout's floor; id-token: write is what trusted
# publishing needs. Nothing else is granted.
permissions:
  contents: read
  id-token: write

jobs:
  repoint:
    runs-on: ubuntu-latest
    # A hung dist-tag write must not hold a runner slot indefinitely (#1402).
    timeout-minutes: 10
    environment: openelement-release
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Re-point the channel tag for all six packages
        # Inputs travel through env, never interpolated into the script body
        # (zizmor template-injection): a dispatch input is arbitrary text.
        env:
          TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # pipefail so the pipeline reports npm's exit status, not tee's — the
          # same trap the Release alias step hit; here a failure is counted and
          # summarized, and any failure fails the run.
          set -o pipefail
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then
            # The element manifest is the line's version anchor — Release reads
            # the same file, and check-release-version.ts keeps all six equal.
            VERSION=$(node -e "console.log(require('./packages/element/package.json').version)")
          fi
          echo "Re-pointing $TAG at @openelement/*@$VERSION"
          SUCCEEDED=0
          FAILED=0
          for PKG in protocol element compiler router create ui; do
            if npm dist-tag add "@openelement/$PKG@$VERSION" "$TAG" 2>&1 | tee "/tmp/disttag-$PKG.log"; then
              SUCCEEDED=$((SUCCEEDED + 1))
            else
              echo "::warning::could not re-point $TAG for $PKG at $VERSION"
              FAILED=$((FAILED + 1))
            fi
          done
          echo "re-point summary: $SUCCEEDED ok, $FAILED failed (tag $TAG at $VERSION)"
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
